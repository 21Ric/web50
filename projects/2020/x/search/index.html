<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
    <style>
        body {
            background-color: white;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0px;
            padding: 0px;
        }
        .top-links {
            text-align: right;
            padding: 20px;
            color: blue;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 200px;
        }
        input[type="text"] {
                width: 400px;
                height: 30px;
                border-radius: 20px;
                padding: 5px;
        }

        .form-flex {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
    </style>
    </head>
    <body>
        <div class="top-links">
            <a href="images.html">Image Search</a>
            <a href="advanced.html">Advanced Search</a>
        </div>
        <div class="search-form">
            <form action="https://www.google.com/search" class="form-flex">
    <input type="text" name="q">
    <br><br>  
    <div class="button-group">
        <input type="submit" value="Google Search">
        <input type="submit" value="I'm Feeling Lucky" name="btnI">
    </div>
    </form>
    </body>
</html>
